# Render blueprint for the FastAPI app. The service root is the repo root because
# apps/api imports ml/ and pipeline/ from there. Set every sync:false variable in
# the Render dashboard. This file has no secret values.
services:
  - type: web
    name: scholarly-pattern-explorer-api
    runtime: python
    plan: free
    # The second step downloads the fastembed ONNX model into <repo>/.cache/fastembed so it
    # ships with the build (free-tier /tmp is wiped on cold start). While ML_EMBEDDER=hash a
    # failed download only warns; with ML_EMBEDDER=fastembed it fails the build.
    buildCommand: pip install -r apps/api/requirements.txt && python -m ml.prefetch_model
    startCommand: uvicorn app.main:app --app-dir apps/api --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DATABASE_URL
        sync: false
      - key: OPENALEX_API_KEY
        sync: false
      - key: OPENALEX_MAILTO
        sync: false
      # Query embedder. MUST match paper_embeddings.model in Supabase (today: hash-v1).
      # Stays hash until the corpus is re-embedded (docs/STATUS.md, 2026-10-16 bob).
      # Switch values after the bge re-embed:
      #   ML_EMBEDDER=fastembed
      #   ML_EMBED_MODEL=BAAI/bge-small-en-v1.5
      #   (optional) ML_MIN_SCORE=0.65   # bge default already (pending chris's benchmark); 0 = off;
      #     beats SEARCH_MIN_SCORE; must be in [0,1], invalid values warn and use the default
      - key: ML_EMBEDDER
        value: hash
      - key: ML_EMBED_MODEL
        sync: false
      - key: ML_EMBED_MODEL_REVISION
        sync: false
      - key: SEARCH_MIN_SCORE
        sync: false
      - key: ML_MIN_SCORE
        sync: false
      - key: ML_VECTOR_BACKEND
        sync: false
      - key: ML_DATA_DIR
        sync: false
      - key: ML_WORKS_PATH
        sync: false
      - key: ML_LLM_URL
        sync: false
      - key: ML_LLM_MODEL
        sync: false
      - key: ML_LLM_API_KEY
        sync: false
      - key: SEARCH_MAX_LIMIT
        sync: false
      - key: GALAXY_NODE_LIMIT
        sync: false
      - key: COUNTRY_SNAPSHOT
        sync: false
      - key: TOPIC_COUNTRY_YEAR_DB
        sync: false
