# Project theme: dark research dashboard.
# Streamlit reads this automatically when you run the app from this folder.
# The extra polish (gradient header, glass cards, pill navigation) is CSS in
# ui_style.py; the colours below must stay in sync with the palette there.

[theme]
base = "dark"
primaryColor = "#2DD4BF"
linkColor = "#5EEAD4"
backgroundColor = "#0A0F1E"
secondaryBackgroundColor = "#131B2E"
textColor = "#E6EAF2"
borderColor = "#243049"
codeBackgroundColor = "#131B2E"

headingFont = "'Space Grotesk', 'Segoe UI', system-ui, sans-serif"
font = "Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
codeFont = "'JetBrains Mono', 'Cascadia Code', Consolas, monospace"
baseFontSize = 15
baseRadius = "0.8rem"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#0D1426"
secondaryBackgroundColor = "#16203A"
borderColor = "#1E2A44"

[server]
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
