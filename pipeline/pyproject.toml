[project]
name = "spe-pipeline"
version = "0.1.0"
description = "Scholarly Pattern Explorer v2 data pipeline: OpenAlex fetch, Postgres loader, sliding-window FP-Growth"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "psycopg[binary]>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
spe-fetch = "spe_pipeline.openalex:main"
spe-load = "spe_pipeline.loader:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
