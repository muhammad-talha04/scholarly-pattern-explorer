services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: spe
      POSTGRES_PASSWORD: spe
      POSTGRES_DB: spe
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spe"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
