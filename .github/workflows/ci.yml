name: ci
on:
  push:
    branches: [v2-rebuild]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: spe, POSTGRES_PASSWORD: spe, POSTGRES_DB: spe }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spe" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://spe:spe@localhost:5432/spe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e "pipeline[dev]" -e "api[dev]"
      - name: Lint
        run: ruff check pipeline api
      - name: Pipeline tests (incl. migration + loader against pgvector)
        run: pytest -q pipeline
      - name: API tests
        working-directory: api
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
