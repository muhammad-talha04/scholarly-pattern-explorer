name: v2 ingest (monthly)
on:
  schedule:
    - cron: "0 3 1 * *"   # 03:00 UTC on the 1st of each month
  workflow_dispatch: {}
  push:
    paths: ["pipeline/**"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests pytest && python -m pytest -q pipeline/tests
  ingest:
    if: github.event_name != 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - name: Restore previous data
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p data
          gh release download data-store -p works_v2.jsonl -p ingest_state.json -p country_snapshot.json -D data --clobber || echo "first run"
      - name: Fetch only new works
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: |
          wc -l < data/works_v2.jsonl > before.txt 2>/dev/null || echo 0 > before.txt
          set +e; python -m pipeline.ingest --max-records 600 --sample-seed "$(date -u +%Y%m)"; code=$?; set -e
          [ "$code" -eq 1 ] && exit 1
          tail -n +$(( $(cat before.txt) + 1 )) data/works_v2.jsonl > data/new.jsonl
      - name: Save back
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release upload data-store data/works_v2.jsonl data/ingest_state.json --clobber
      - name: Check database connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install "psycopg[binary]>=3.1"
          python - <<'PY'
          import os, sys
          from urllib.parse import urlsplit
          u = os.environ.get("DATABASE_URL", "")
          if not u:
              sys.exit("DATABASE_URL secret is empty or missing")
          p = urlsplit(u)
          print("scheme", p.scheme, "| user", p.username, "| host", p.hostname, "| port", p.port, "| db", p.path)
          import psycopg
          try:
              with psycopg.connect(u, connect_timeout=15) as c:
                  print("connected:", c.execute("select 1").fetchone())
          except Exception as e:
              print("CONNECT FAILED:", type(e).__name__, str(e).replace(p.password or "\0", "***")[:300])
              sys.exit(1)
          PY
      - name: Embeddings, patterns, discoveries, galaxy and country analytics
        # The API serves patterns, gaps, emerging, runs and countries from deploy/data.
        # These steps update those files in place and the next step commits them, so
        # the site refreshes every month (before, they stayed frozen at 2026-10-24).
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ML_DATA_DIR: deploy/data/ml
          COUNTRY_SNAPSHOT: deploy/data/country_snapshot.json
          ML_EMBEDDER: fastembed   # never fall back to the hash embedder on real data
          ML_EMBED_MODEL: BAAI/bge-small-en-v1.5   # must match the stored vectors
        run: |
          pip install -r ml/requirements.txt
          python -m ml.cli index --jsonl data/new.jsonl --max-db-mb 490   # free tier is 500 MB; deleted rows keep the file at ~472 MB until reused
          # Country analytics first: it also fills the topic_country_year table that
          # emerging topics read. The snapshot's tally holds every counter, so only new works are read.
          python -m pipeline.country_stats --new data/new.jsonl --prev deploy/data/country_snapshot.json \
                 --out deploy/data/country_snapshot.json
          python -m ml.cli update --jsonl data/new.jsonl   # incremental: already-seen work ids are skipped
      - name: Commit the refreshed analytics (Render and Vercel redeploy from main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/data
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "Monthly analytics refresh ($(date -u +%F))"
          git push
